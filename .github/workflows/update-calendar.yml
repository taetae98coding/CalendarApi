name: Update Calendar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      MAX_CONCURRENCY:
        required: false
        description: 외부 API 한 곳으로 동시에 나갈 수 있는 요청 수 (기본 8)
        type: string
      MAX_REQUESTS_PER_SECOND:
        required: false
        description: 외부 API 한 곳으로 나가는 초당 요청 수 (기본 20)
        type: string

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle Task
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          MAX_CONCURRENCY: ${{ inputs.MAX_CONCURRENCY }}
          MAX_REQUESTS_PER_SECOND: ${{ inputs.MAX_REQUESTS_PER_SECOND }}
        run: ./gradlew updateCalendar

      - name: Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              git commit -m "[TRIGGER] Update calendar"
            else
              git commit -m "[AUTOMATION] Update calendar"
            fi
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git pull --rebase
          git push
